<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#08142c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="野球ビジョン">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>野球ビジョントレーナー</title>
<style>
:root{
  --bg:#071225;--panel:#102347;--panel2:#132c58;--text:#f4f8ff;--muted:#9db1d5;
  --blue:#64baff;--good:#42d18b;--bad:#ff6f82;--line:rgba(255,255,255,.12)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:linear-gradient(180deg,#061023,#0b1833);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh
}
.app{max-width:760px;margin:auto;padding:calc(12px + env(safe-area-inset-top)) 14px calc(22px + env(safe-area-inset-bottom))}
h1{font-size:24px;margin:6px 0}
h2{font-size:21px;margin:0}
.sub{font-size:12px;color:var(--muted)}
.card{background:rgba(16,35,71,.97);border:1px solid var(--line);border-radius:20px;padding:15px;margin:12px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
button{border:0;border-radius:14px;padding:13px 10px;background:#1a3e78;color:white;font-weight:800;font-size:15px}
button:active{transform:scale(.985)}
button.primary{background:linear-gradient(135deg,#2797ea,#71c5ff);color:#04152b}
button.ghost{background:#0b1a36;color:#cfe4ff}
button.good{background:#135b3d}
button.bad{background:#6b2732}
.hidden{display:none!important}

.screen{display:none}
.screen.active{display:block}

.topHeader{margin-bottom:10px}
.version{opacity:.65}
.heroPoints{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rankPanel{margin-top:10px;padding:10px;border-radius:14px;background:#0b1a36}
.rankTop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:7px}
.rankBadge{font-size:17px;font-weight:900}
.rankBar{height:9px;background:#1a2a48;border-radius:999px;overflow:hidden}
.rankBar>div{height:100%;width:0%;background:linear-gradient(90deg,#9fb4d9,#f4d35e);transition:width .35s ease}

.menuGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menuCard{
  min-height:112px;text-align:left;padding:14px;border-radius:18px;
  background:linear-gradient(180deg,#173967,#10274c);border:1px solid var(--line)
}
.menuCard .icon{font-size:28px;display:block;margin-bottom:7px}
.menuCard strong{font-size:16px;display:block}
.menuCard span{font-size:11px;color:#b9cbea;line-height:1.4;display:block;margin-top:5px}

.backRow{display:flex;gap:8px;margin-bottom:10px}
.backRow button{flex:1}
.settingBlock{margin-top:14px}
.settingTitle{font-size:13px;color:#cfe1ff;margin-bottom:8px}
.seg{display:flex;gap:7px;flex-wrap:wrap}
.seg button{flex:1 1 auto;font-size:13px;padding:11px 8px}
.seg .active{outline:2px solid var(--blue);background:#24569b}
input[type=range]{width:100%}
.startBig{width:100%;font-size:18px;padding:16px;margin-top:16px}

.trainingTop{display:flex;gap:8px;position:sticky;top:calc(env(safe-area-inset-top) + 6px);z-index:20;background:#08142c;padding:6px 0}
.trainingTop button{flex:1}
.trainingTitle{font-size:16px;font-weight:900}
.trainingMeta{font-size:12px;color:var(--muted)}

.arena{height:430px;position:relative;overflow:hidden;border-radius:22px;background:
radial-gradient(circle at 50% 10%,#28507a 0,#102a52 28%,#09192f 62%,#061123 100%);border:1px solid var(--line)}
.mound{position:absolute;left:50%;top:18%;transform:translateX(-50%);width:27px;height:8px;background:#b8aa85;border-radius:50%}
.zone{position:absolute;width:210px;height:255px;left:50%;bottom:72px;transform:translateX(-50%);
border:2px solid rgba(255,255,255,.75);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}
.zone div{border:1px solid rgba(255,255,255,.15)}
.plate{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:60px;height:44px;background:#f2f4f7;
clip-path:polygon(0 0,100% 0,86% 64%,50% 100%,14% 64%)}
.ball{position:absolute;width:36px;height:36px;left:calc(50% - 18px);top:54px;border-radius:50%;background:#fff;
color:#0a1426;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;
box-shadow:0 0 0 2px #d9d9d9 inset,0 0 15px rgba(255,255,255,.45);z-index:5}
.msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:8;background:rgba(0,0,0,.58);
padding:12px 16px;border-radius:13px;font-weight:800;text-align:center;backdrop-filter:blur(4px);white-space:pre-line}
.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:11px}
.answers button{font-size:13px;padding:11px 4px}
.answers.two{grid-template-columns:1fr 1fr}

.numberGrid{display:grid;gap:8px;margin-top:12px}
.numberGrid.grid3{grid-template-columns:repeat(3,1fr)}
.numberGrid.grid4{grid-template-columns:repeat(4,1fr)}
.numberGrid.grid5{grid-template-columns:repeat(5,1fr)}
.numberGrid button{aspect-ratio:1/1;font-size:30px;font-weight:900;background:#173d78;border:2px solid rgba(255,255,255,.08);padding:2px}
.numberGrid.grid4 button{font-size:24px}
.numberGrid.grid5 button{font-size:20px}
.numberGrid button.done{opacity:.20;transform:scale(.96)}
.numberGrid button.wrong{outline:3px solid #ff6f82}
.numberGrid button.hiddenNumber{color:transparent}
.numberGrid button.flashNumber{color:white;background:#24569b;box-shadow:0 0 0 3px #64baff inset}
.numberInfo{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:14px;color:#cfe1ff}
.bestBox{margin-top:10px;padding:10px;border-radius:12px;background:#0b1a36;text-align:center;font-weight:800}
.numberHelp{margin-top:8px;font-size:12px;color:#9db1d5;line-height:1.5}

.quizQuestion{padding:14px;border-radius:14px;background:#0b1a36;font-size:18px;font-weight:800;line-height:1.55}
.quizMeta{display:flex;justify-content:space-between;align-items:center;margin:10px 2px;color:#cfe1ff;font-size:13px}
.quizChoices{display:grid;gap:10px;margin-top:10px}
.quizChoices.two{grid-template-columns:1fr 1fr}
.quizChoices.three{grid-template-columns:1fr}
.quizChoices button{min-height:54px;font-size:17px;font-weight:800}
.quizExplain{margin-top:10px;padding:12px;border-radius:12px;background:#102446;line-height:1.55}
.quizNext{width:100%;margin-top:10px;background:linear-gradient(135deg,#2797ea,#71c5ff);color:#04152b;font-weight:900}
.progressCard{margin-top:10px}
.bar{height:8px;background:#08172e;border-radius:8px;overflow:hidden}
.bar>div{height:100%;background:#5ab9ff}
.resultBox{text-align:center;padding:22px 12px}
.resultBox .big{font-size:28px;font-weight:900;margin-bottom:8px}
.resultBox button{width:100%;margin-top:10px}

.arena.reactionGo{
  background:
    radial-gradient(circle at 50% 50%,rgba(255,255,255,.95) 0%,rgba(120,255,170,.95) 12%,rgba(42,209,139,.85) 28%,#102a52 58%,#061123 100%);
  box-shadow:0 0 38px rgba(66,209,139,.75) inset,0 0 24px rgba(66,209,139,.35);
}
#reactionBtn.reactionGo{
  background:linear-gradient(135deg,#7dffb2,#d6ffe6);
  color:#052514;
  box-shadow:0 0 20px rgba(66,209,139,.95);
  transform:scale(1.02);
}


.scoreSymbol{
  width:100%;min-height:135px;border-radius:16px;background:#f5f5f2;color:#111;
  display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;
  border:1px solid rgba(255,255,255,.15);margin:10px 0 12px
}
.scoreDiamond{
  width:92px;height:92px;border:3px solid #555;transform:rotate(45deg);position:relative;background:white
}
.scoreDiamond .center{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-45deg);
  font-size:32px;font-weight:900;color:#222;white-space:nowrap
}
.scoreSymbolText{font-size:44px;font-weight:900;font-family:Georgia,"Times New Roman",serif}
.scoreSymbolSub{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:11px;color:#555}
.scoreRunDot{width:20px;height:20px;border-radius:50%;background:#e11;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.scoreRunRing{width:20px;height:20px;border-radius:50%;border:3px solid #e44;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:white}
.scoreQuizChoices{display:grid;gap:10px}
.scoreQuizChoices button{min-height:52px;font-size:16px}
.scoreExplain{margin-top:10px;padding:12px;border-radius:12px;background:#102446;line-height:1.55}
.scoreLegend{font-size:11px;color:#9db1d5;line-height:1.45;margin-top:8px}

</style>
</head>
<body>
<div class="app">

  <!-- TOP -->
  <section id="screenTop" class="screen active">
    <div class="topHeader">
      <h1>⚾ 野球ビジョントレーナー</h1>
      <div class="sub">視覚・反応・判断・ルール　<span class="version">v1.5</span></div>
    </div>

    <section class="card">
      <div class="heroPoints">
        <div>
          <strong>🏆 TOTAL POINTS</strong>
          <div class="sub">トレーニングで貯まるポイント</div>
        </div>
        <div style="font-size:28px;font-weight:900"><span id="totalPoints">0</span> pt</div>
      </div>
      <div class="rankPanel">
        <div class="rankTop">
          <span id="rankBadge" class="rankBadge">🥉 Bronze</span>
          <span id="nextRankText" class="sub">Silverまであと500pt</span>
        </div>
        <div class="rankBar"><div id="rankProgress"></div></div>
      </div>
    </section>

    <section class="card">
      <div class="row"><strong>トレーニングを選ぶ</strong><span class="sub">タップして設定へ</span></div>
      <div class="menuGrid" style="margin-top:12px">
        <button class="menuCard" data-menu="course"><span class="icon">🎯</span><strong>コース判定</strong><span>球が来たコースを素早く判断</span></button>
        <button class="menuCard" data-menu="pitch"><span class="icon">⚾</span><strong>球種判定</strong><span>変化を見て球種を判断</span></button>
        <button class="menuCard" data-menu="flash"><span class="icon">👁️</span><strong>瞬間視</strong><span>一瞬で見えた情報を判断</span></button>
        <button class="menuCard" data-menu="select"><span class="icon">🧠</span><strong>選球眼</strong><span>打つ／見逃すを瞬時に判断</span></button>
        <button class="menuCard" data-menu="reaction"><span class="icon">⚡</span><strong>反応速度</strong><span>光った瞬間にタップ</span></button>
        <button class="menuCard" data-menu="numbers"><span class="icon">🔢</span><strong>数字タップ</strong><span>視野・探索・記憶を鍛える</span></button>
        <button class="menuCard" data-menu="rules" style="grid-column:1 / -1"><span class="icon">📘</span><strong>野球ルールクイズ</strong><span>初級〜ボーイズ実戦まで</span></button>
        <button class="menuCard" data-menu="score" style="grid-column:1 / -1"><span class="icon">📝</span><strong>スコア記号クイズ</strong><span>早稲田式の記号を見て読めるようにする</span></button>
      </div>
    </section>
  </section>

  <!-- SETTINGS -->
  <section id="screenSettings" class="screen">
    <div class="backRow">
      <button id="settingsHomeBtn" class="ghost">← トップへ</button>
    </div>
    <section class="card">
      <h2 id="settingsTitle">設定</h2>
      <div id="settingsDesc" class="sub" style="margin-top:5px"></div>

      <div id="speedSetting" class="settingBlock">
        <div class="row"><span class="settingTitle">疑似球速</span><strong><span id="speedText">120</span> km/h</strong></div>
        <input id="speed" type="range" min="80" max="150" step="5" value="120">
      </div>

      <div id="batterSetting" class="settingBlock">
        <div class="settingTitle">打席</div>
        <div class="seg">
          <button id="leftBat" class="active">左打者</button>
          <button id="rightBat">右打者</button>
        </div>
      </div>

      <div id="difficultySetting" class="settingBlock hidden">
        <div class="settingTitle">難易度</div>
        <div id="difficultyButtons" class="seg"></div>
      </div>

      <button id="settingsStartBtn" class="primary startBig">この設定で開始！</button>
    </section>
  </section>

  <!-- TRAINING -->
  <section id="screenTraining" class="screen">
    <div class="trainingTop">
      <button id="stopBtn" class="bad">■ 中止</button>
      <button id="trainingHomeBtn" class="ghost">⌂ トップへ</button>
    </div>

    <section class="card">
      <div class="row">
        <div>
          <div id="trainingTitle" class="trainingTitle"></div>
          <div id="trainingMeta" class="trainingMeta"></div>
        </div>
        <div id="trainingCounter" class="sub"></div>
      </div>
    </section>

    <section id="visualTrainingCard" class="card">
      <div id="arena" class="arena">
        <div class="mound"></div>
        <div class="zone">
          <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
        </div>
        <div class="plate"></div>
        <div id="ball" class="ball hidden"></div>
        <div id="msg" class="msg">準備中...</div>
      </div>

      <div id="courseAns" class="answers hidden">
        <button data-answer="1">左上</button><button data-answer="2">上</button><button data-answer="3">右上</button>
        <button data-answer="4">左</button><button data-answer="5">中央</button><button data-answer="6">右</button>
        <button data-answer="7">左下</button><button data-answer="8">下</button><button data-answer="9">右下</button>
      </div>

      <div id="pitchAns" class="answers hidden">
        <button data-answer="straight">ストレート</button>
        <button data-answer="slider">スライダー</button>
        <button data-answer="curve">カーブ</button>
        <button data-answer="fork">フォーク</button>
        <button data-answer="change">チェンジ</button>
      </div>

      <div id="flashAns" class="answers hidden"></div>

      <div id="selectAns" class="answers two hidden">
        <button class="good" data-answer="swing">打つ</button>
        <button class="bad" data-answer="take">見逃す</button>
      </div>

      <div id="reactionAns" class="answers hidden" style="grid-template-columns:1fr">
        <button id="reactionBtn" class="primary">光ったらタップ</button>
      </div>
    </section>

    <section id="numberTrainingCard" class="card hidden">
      <div class="numberInfo">
        <span><strong id="numberLevelName"></strong>　次：<strong id="nextNumber">1</strong></span>
        <span>タイム：<strong id="numberTime">0.00</strong> 秒</span>
      </div>
      <div id="numberGrid" class="numberGrid"></div>
      <div class="bestBox">自己ベスト：<span id="numberBest">--</span></div>
      <div id="numberHelp" class="numberHelp"></div>
    </section>

    <section id="rulesTrainingCard" class="card hidden">
      <div class="quizMeta">
        <span><strong id="quizLevelName"></strong>　問題 <strong id="quizNo">1</strong>/10</span>
        <span>正解 <strong id="quizCorrect">0</strong></span>
      </div>
      <div id="quizQuestion" class="quizQuestion"></div>
      <div id="quizChoices" class="quizChoices"></div>
      <div id="quizExplain" class="quizExplain hidden"></div>
      <button id="quizNextBtn" class="quizNext hidden">次の問題へ →</button>
    </section>


    <section id="scoreTrainingCard" class="card hidden">
      <div class="quizMeta">
        <span><strong id="scoreLevelName"></strong>　問題 <strong id="scoreNo">1</strong>/10</span>
        <span>正解 <strong id="scoreCorrect">0</strong></span>
      </div>
      <div id="scoreQuestion" class="quizQuestion"></div>
      <div id="scoreSymbol" class="scoreSymbol"></div>
      <div id="scoreChoices" class="scoreQuizChoices"></div>
      <div id="scoreExplain" class="scoreExplain hidden"></div>
      <button id="scoreNextBtn" class="quizNext hidden">次の問題へ →</button>
      <div class="scoreLegend">早稲田式の代表的な記号を中心に出題します。団体・スコアブックにより一部記号が異なる場合があります。</div>
    </section>

    <section id="progressCard" class="card progressCard">
      <div class="row"><strong>進捗</strong><span class="sub" id="progressText"></span></div>
      <div class="bar" style="margin-top:8px"><div id="progress" style="width:0%"></div></div>
    </section>
  </section>

  <!-- RESULT -->
  <section id="screenResult" class="screen">
    <section class="card resultBox">
      <div id="resultTitle" class="big">完了！</div>
      <div id="resultText" style="white-space:pre-line;line-height:1.7"></div>
      <button id="retryBtn" class="primary">もう一度</button>
      <button id="resultHomeBtn" class="ghost">トップへ戻る</button>
    </section>
  </section>

</div>

<script>
(()=>{
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const names={
  course:'コース判定',pitch:'球種判定',flash:'瞬間視',select:'選球眼',
  reaction:'反応速度',numbers:'数字タップ',rules:'野球ルールクイズ',score:'スコア記号クイズ'
};
const descs={
  course:'球の到達位置を見て9分割のコースを判断します。',
  pitch:'軌道の違いを見て球種を判断します。',
  flash:'一瞬だけ表示される情報を見抜きます。',
  select:'ストライク／ボールを見極めて「打つ」「見逃す」を判断します。',
  reaction:'合図が出たらできるだけ速くタップします。',
  numbers:'数字を順番に探してタップします。',
  rules:'野球ルールを○×・選択問題で確認します。',
  score:'早稲田式スコアの記号を見て意味を読み取る練習です。'
};
const S={
  mode:'course',speed:120,batter:'left',difficulty:null,running:false,round:0,
  answer:null,startTs:0,streak:0,bestStreak:0,ready:false,timer:null,
  totalPoints:0,numberNext:1,numberStart:0,numberTimer:null,numberFlashTimer:null,
  numberMax:9,quizQuestions:[],quizIndex:0,quizCorrect:0,quizLocked:false,scoreQuestions:[],scoreIndex:0,scoreCorrect:0,scoreLocked:false
};

const courseLabels={'1':'左上','2':'上','3':'右上','4':'左','5':'中央','6':'右','7':'左下','8':'下','9':'右下'};
const pitchLabels={straight:'ストレート',slider:'スライダー',curve:'カーブ',fork:'フォーク',change:'チェンジ'};

function answerLabel(mode,val){
  if(mode==='course')return courseLabels[String(val)]||String(val);
  if(mode==='pitch')return pitchLabels[val]||String(val);
  if(mode==='select')return val==='swing'?'打つ':'見逃す';
  return String(val);
}

function pointsKey(){return 'bvt_total_points'}
function numberBestKey(level){return 'bvt_number_best_'+level}
function loadPoints(){S.totalPoints=Number(localStorage.getItem(pointsKey())||0);renderPoints()}
function addPoints(n){S.totalPoints+=n;localStorage.setItem(pointsKey(),String(S.totalPoints));renderPoints()}
function getNumberBest(level){const v=Number(localStorage.getItem(numberBestKey(level))||0);return v>0?v:null}
function setNumberBest(ms,level){localStorage.setItem(numberBestKey(level),String(ms))}
function getRankInfo(points){
  const ranks=[
    {name:'Bronze',icon:'🥉',min:0,next:500},
    {name:'Silver',icon:'🥈',min:500,next:1500},
    {name:'Gold',icon:'🥇',min:1500,next:3000},
    {name:'Platinum',icon:'💠',min:3000,next:5000},
    {name:'Diamond',icon:'💎',min:5000,next:null}
  ];
  for(let i=ranks.length-1;i>=0;i--)if(points>=ranks[i].min)return ranks[i];
  return ranks[0];
}
function renderPoints(){
  $('#totalPoints').textContent=S.totalPoints;
  const r=getRankInfo(S.totalPoints);
  $('#rankBadge').textContent=r.icon+' '+r.name;
  if(r.next===null){
    $('#nextRankText').textContent='MAX RANK';
    $('#rankProgress').style.width='100%';
  }else{
    const remain=r.next-S.totalPoints;
    const pct=Math.max(0,Math.min(100,((S.totalPoints-r.min)/(r.next-r.min))*100));
    $('#nextRankText').textContent=getRankInfo(r.next).name+'まであと'+remain+'pt';
    $('#rankProgress').style.width=pct+'%';
  }
}

function showScreen(id){
  $$('.screen').forEach(s=>s.classList.remove('active'));
  $('#'+id).classList.add('active');
  window.scrollTo({top:0,behavior:'instant'});
}
function goTop(){
  stopAll();
  showScreen('screenTop');
}
function stopAll(){
  S.running=false;S.ready=false;S.quizLocked=true;S.scoreLocked=true;
  clearTimeout(S.timer);clearInterval(S.numberTimer);clearTimeout(S.numberFlashTimer);
  resetBall();
}
function openSettings(mode){
  stopAll();
  S.mode=mode;
  S.difficulty=null;
  $('#settingsTitle').textContent=names[mode];
  $('#settingsDesc').textContent=descs[mode];

  const usesSpeed=['course','pitch','select'].includes(mode);
  const usesBatter=['course','pitch','select'].includes(mode);
  $('#speedSetting').classList.toggle('hidden',!usesSpeed);
  $('#batterSetting').classList.toggle('hidden',!usesBatter);

  const diff=$('#difficultySetting');
  const btns=$('#difficultyButtons');
  if(mode==='numbers'){
    diff.classList.remove('hidden');
    btns.innerHTML=`
      <button data-diff="beginner">🌱 初級<br><span class="sub">3×3</span></button>

function startTraining(){
  stopAll();

  $('#trainingTitle').textContent=names[S.mode];
  $('#trainingMeta').textContent=buildMeta();
  $('#visualTrainingCard').classList.toggle('hidden',['numbers','rules','score'].includes(S.mode));

  $('#rulesTrainingCard').classList.toggle('hidden',S.mode!=='rules');
  $('#scoreTrainingCard').classList.toggle('hidden',S.mode!=='score');
  $('#progressCard').classList.toggle('hidden',['numbers'].includes(S.mode));
  showScreen('screenTraining');

  else if(S.mode==='rules')startRules();
  else if(S.mode==='score')startScoreQuiz();

function buildMeta(){
  if(['course','pitch','select'].includes(S.mode))return `${S.speed}km/h・${S.batter==='left'?'左打者':'右打者'}`;
  if(S.mode==='numbers'){
    return S.difficulty==='beginner'?'初級 3×3':S.difficulty==='intermediate'?'中級 4×4':'上級 5×5・瞬間表示';
  }
  if(S.mode==='rules'){
    const m={beginner:'初級',intermediate:'中級',advanced:'上級',boys:'ボーイズ実戦'};return m[S.difficulty];
  }
  if(S.mode==='score'){
    const m={beginner:'初級 記号→意味',intermediate:'中級 意味→記号',advanced:'上級 実戦読み取り'};return m[S.difficulty];
  }
  const m={easy:'初級',normal:'中級',hard:'上級'};return m[S.difficulty]||'';
}

function updateVisualProgress(){
  $('#trainingCounter').textContent=S.round+'/30';
  $('#progressText').textContent=S.round+'/30';
  $('#progress').style.width=(S.round/30*100)+'%';
}
function resetBall(){
  const b=$('#ball'); if(b){
    b.classList.add('hidden');b.style.transition='none';b.style.transform='translate(0,0) scale(.55)';b.textContent='';
  }
  const arena=$('#arena'); if(arena) arena.classList.remove('reactionGo');
  const rb=$('#reactionBtn'); if(rb) rb.classList.remove('reactionGo');
}
function duration(){
  let d=Math.max(300,1350-(S.speed-80)*14);
  if(S.mode==='flash'){
    if(S.difficulty==='easy')d=850;
    if(S.difficulty==='normal')d=600;
    if(S.difficulty==='hard')d=380;
  }
  return d;
}
function coursePos(i){
  const arena=$('#arena').getBoundingClientRect();
  const zone=document.querySelector('.zone').getBoundingClientRect();
  const col=(i-1)%3,row=Math.floor((i-1)/3);
  const targetCenterX=(zone.left-arena.left)+(col+.5)*(zone.width/3);
  const targetCenterY=(zone.top-arena.top)+(row+.5)*(zone.height/3);
  return {x:targetCenterX-arena.width/2,y:targetCenterY-72};
}
function animate(x,y,txt=''){
  const b=$('#ball');b.textContent=txt;b.classList.remove('hidden');
  requestAnimationFrame(()=>{b.style.transition=`transform ${duration()}ms linear`;b.style.transform=`translate(${x}px,${y}px) scale(1)`});
}
function showAnswerPanel(id){
  ['courseAns','pitchAns','flashAns','selectAns','reactionAns'].forEach(x=>$('#'+x).classList.add('hidden'));
  if(id)$('#'+id).classList.remove('hidden');
}
function nextVisual(){
  if(!S.running)return;
  if(S.round>=30){
    finishGeneric('30球終了！',`トレーニング完了\n+${S.round*0} pt`);
    return;
  }
  S.round++;updateVisualProgress();
  $('#msg').classList.add('hidden');resetBall();clearTimeout(S.timer);
  if(S.mode==='course')course();
  if(S.mode==='pitch')pitch();
  if(S.mode==='flash')flash();
  if(S.mode==='select')selectMode();
  if(S.mode==='reaction')reaction();
}
function course(){
  showAnswerPanel('courseAns');
  const a=1+Math.floor(Math.random()*9);S.answer=String(a);
  const p=coursePos(a);animate(p.x,p.y);S.startTs=performance.now()+duration();
}
function pitch(){
  showAnswerPanel('pitchAns');
  const types=['straight','slider','curve','fork','change'];
  const t=types[Math.floor(Math.random()*types.length)];S.answer=t;
  let x=0,y=245;
  if(t==='slider')x=75;
  if(t==='curve'){x=-55;y=285}
  if(t==='fork')y=315;
  if(t==='change'){x=25;y=275}
  animate(x,y);S.startTs=performance.now()+duration();
}
function flash(){
  showAnswerPanel('flashAns');
  const vals=['3','6','8','9','12','15'];
  const v=vals[Math.floor(Math.random()*vals.length)];
  S.answer=v;

  // 正解は必ず候補に入れ、不正解を2つ追加する
  const distractors=shuffleArray(vals.filter(x=>x!==v)).slice(0,2);
  const choices=shuffleArray([v,...distractors]);
  $('#flashAns').innerHTML=choices.map(x=>`<button data-answer="${x}">${x}</button>`).join('');

  animate(0,235,v);
  const showMs=S.difficulty==='easy'?650:S.difficulty==='hard'?250:400;
  S.timer=setTimeout(()=>$('#ball').classList.add('hidden'),showMs);
  S.startTs=performance.now();
}
function selectMode(){
  showAnswerPanel('selectAns');
  const strike=Math.random()<.68;S.answer=strike?'swing':'take';
  let x,y;
  if(strike){const p=coursePos(1+Math.floor(Math.random()*9));x=p.x;y=p.y}
  else{
    const arena=$('#arena').getBoundingClientRect(),zone=document.querySelector('.zone').getBoundingClientRect();
    const startCenterX=arena.width/2,startCenterY=72;
    const c=[
      {cx:(zone.left-arena.left)-28,cy:(zone.top-arena.top)+zone.height*.25},
      {cx:(zone.right-arena.left)+28,cy:(zone.top-arena.top)+zone.height*.25},
      {cx:(zone.left-arena.left)-28,cy:(zone.top-arena.top)+zone.height*.75},
      {cx:(zone.right-arena.left)+28,cy:(zone.top-arena.top)+zone.height*.75},
      {cx:(zone.left-arena.left)+zone.width*.5,cy:(zone.bottom-arena.top)+28}
    ][Math.floor(Math.random()*5)];
    x=c.cx-startCenterX;y=c.cy-startCenterY;
  }
  animate(x,y);S.startTs=performance.now()+duration();
}
function reaction(){
  showAnswerPanel('reactionAns');
  const btn=$('#reactionBtn');
  const arena=$('#arena');
  btn.textContent='光ったらタップ';
  btn.classList.remove('reactionGo');
  arena.classList.remove('reactionGo');

  S.answer='tap';
  S.ready=false;

  const ranges=S.difficulty==='easy'?[1800,3200]:S.difficulty==='hard'?[700,1800]:[1100,2600];
  const delay=ranges[0]+Math.random()*(ranges[1]-ranges[0]);

  S.timer=setTimeout(()=>{
    if(!S.running)return;
    S.ready=true;
    S.startTs=performance.now();

    arena.classList.add('reactionGo');
    btn.classList.add('reactionGo');
    btn.textContent='今！タップ！';
  },delay);
}
function visualAnswer(v){
  if(!S.running||S.answer===null)return;
  if(S.mode==='reaction'&&!S.ready){
    clearTimeout(S.timer);
    $('#arena').classList.remove('reactionGo');
    $('#reactionBtn').classList.remove('reactionGo');
    $('#msg').classList.remove('hidden');
    $('#msg').textContent='早すぎ！\n光るまで待って';
    showAnswerPanel(null);
    S.answer=null;
    setTimeout(()=>{
      if(!S.running)return;
      $('#msg').classList.add('hidden');
      S.round=Math.max(0,S.round-1);
      nextVisual();
    },900);
    return;
  }
  const correctValue=S.answer;
  const ok=String(v)===String(correctValue);
  const rt=Math.max(0,performance.now()-S.startTs);
  if(S.mode==='reaction'){
    $('#arena').classList.remove('reactionGo');
    $('#reactionBtn').classList.remove('reactionGo');
  }
  S.answer=null;
  if(ok){S.streak++;let pts=10;if(S.streak%5===0)pts+=20;addPoints(pts)}
  else S.streak=0;
  $('#msg').classList.remove('hidden');
  $('#msg').textContent=ok?'○ 正解':('× 不正解\n正解：'+answerLabel(S.mode,correctValue));
  showAnswerPanel(null);
  setTimeout(nextVisual,1000);
}

function shuffleArray(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}

/* NUMBERS */
function startNumbers(){
  S.numberNext=1;
  S.numberMax=S.difficulty==='beginner'?9:S.difficulty==='intermediate'?16:25;
  S.numberStart=performance.now();
  $('#nextNumber').textContent='1';
  $('#numberTime').textContent='0.00';
  $('#numberLevelName').textContent=buildMeta();
  const best=getNumberBest(S.difficulty);
  $('#numberBest').textContent=best?(best/1000).toFixed(2)+' 秒':'記録なし';
  const nums=shuffleArray(Array.from({length:S.numberMax},(_,i)=>i+1));
  const cls=S.difficulty==='beginner'?'grid3':S.difficulty==='intermediate'?'grid4':'grid5';
  $('#numberGrid').className='numberGrid '+cls;
  $('#numberGrid').innerHTML=nums.map(n=>`<button data-number="${n}">${n}</button>`).join('');
  if(S.difficulty==='advanced'){
    $('#numberHelp').textContent='次の数字が1秒だけ表示されます。消えた位置を覚えてタップ！';
    $$('#numberGrid button').forEach(b=>b.classList.add('hiddenNumber'));
    setTimeout(flashAdvancedNumber,350);
  }else{
    $('#numberHelp').textContent=`1→${S.numberMax}をできるだけ速くタップ！`;
  }
  clearInterval(S.numberTimer);
  S.numberTimer=setInterval(()=>{if(S.running)$('#numberTime').textContent=((performance.now()-S.numberStart)/1000).toFixed(2)},50);
}
function flashAdvancedNumber(){
  if(!S.running||S.mode!=='numbers'||S.difficulty!=='advanced')return;
  clearTimeout(S.numberFlashTimer);
  const btn=$(`#numberGrid button[data-number="${S.numberNext}"]`);
  if(!btn)return;
  btn.classList.remove('hiddenNumber');btn.classList.add('flashNumber');
  S.numberFlashTimer=setTimeout(()=>{btn.classList.add('hiddenNumber');btn.classList.remove('flashNumber')},1000);
}
function numberTap(btn){
  if(!S.running||S.mode!=='numbers')return;
  const n=Number(btn.dataset.number);
  if(n!==S.numberNext){
    btn.classList.add('wrong');setTimeout(()=>btn.classList.remove('wrong'),220);
    if(S.difficulty==='advanced')setTimeout(flashAdvancedNumber,400);
    return;
  }
  btn.classList.add('done');btn.classList.remove('hiddenNumber','flashNumber');
  if(n===S.numberMax){
    clearInterval(S.numberTimer);clearTimeout(S.numberFlashTimer);
    const elapsed=performance.now()-S.numberStart;
    const oldBest=getNumberBest(S.difficulty);
    const isFirst=!oldBest,isBest=!!oldBest&&elapsed<oldBest;
    let pts=S.difficulty==='beginner'?50:S.difficulty==='intermediate'?80:120;
    if(isFirst)setNumberBest(elapsed,S.difficulty);
    else if(isBest){pts+=100;setNumberBest(elapsed,S.difficulty)}
    addPoints(pts);
    const head=isFirst?'🎯 初記録！':isBest?'🔥 自己ベスト更新！':'🎯 完了！';
    finishGeneric(head,`${(elapsed/1000).toFixed(2)} 秒\n+${pts} pt`);
    return;
  }
  S.numberNext++;$('#nextNumber').textContent=S.numberNext;
  if(S.difficulty==='advanced')setTimeout(flashAdvancedNumber,500);
}

function startRules(){
  const base=RULE_QUESTIONS[S.difficulty]||RULE_QUESTIONS.beginner;
  let pool=[];
  while(pool.length<10)pool=pool.concat(shuffleArray(base));
  S.quizQuestions=pool.slice(0,10);S.quizIndex=0;S.quizCorrect=0;S.quizLocked=false;
  renderRuleQuestion();
}
function renderRuleQuestion(){
  if(S.quizIndex>=10){finishRules();return}
  const q=S.quizQuestions[S.quizIndex];
  $('#quizLevelName').textContent=buildMeta();
  $('#quizNo').textContent=S.quizIndex+1;
  $('#quizCorrect').textContent=S.quizCorrect;
  $('#quizQuestion').textContent=q.q;
  $('#quizChoices').className='quizChoices '+(q.c.length===2?'two':'three');
  $('#quizChoices').innerHTML=q.c.map((c,i)=>`<button data-quiz="${i}">${c}</button>`).join('');
  $('#quizExplain').classList.add('hidden');$('#quizExplain').textContent='';
  $('#quizNextBtn').classList.add('hidden');
  $('#trainingCounter').textContent=(S.quizIndex+1)+'/10';
  $('#progressText').textContent=(S.quizIndex+1)+'/10';
  $('#progress').style.width=((S.quizIndex+1)/10*100)+'%';
  S.quizLocked=false;
}
function answerRule(idx){
  if(!S.running||S.quizLocked)return;
  S.quizLocked=true;
  const q=S.quizQuestions[S.quizIndex],ok=Number(idx)===q.a;
  if(ok){S.quizCorrect++;addPoints(20)}
  $('#quizCorrect').textContent=S.quizCorrect;
  $('#quizExplain').classList.remove('hidden');
  $('#quizExplain').textContent=(ok?'○ 正解！ +20pt':'× 不正解')+'\n'+q.e;
  $('#quizNextBtn').classList.remove('hidden');
}
function nextRuleQuestion(){if(!S.running)return;S.quizIndex++;renderRuleQuestion()}
function finishRules(){
  let bonus=S.quizCorrect===10?100:S.quizCorrect>=8?50:0;
  if(bonus)addPoints(bonus);
  let t=`10問中 ${S.quizCorrect}問正解`;
  if(bonus)t+=`\nボーナス +${bonus}pt`;
  if(S.quizCorrect===10)t+='\n🏆 PERFECT！';
  finishGeneric('ルールクイズ終了！',t);
}

 {symbol:'3A',label:'一塁手が自ら一塁を踏んでアウト',ex:'3は一塁手、Aは一塁。送球せず自分で一塁を踏んだプレーです。'},
 {symbol:'K',label:'空振り三振',ex:'Kは三振を表す代表的な記号です。'},

const SCORE_ADVANCED=[
 {
  symbol:'Ⅰ / 6-3',
  label:'1アウト目。遊撃手が処理して一塁送球で打者アウト',
  ex:'Ⅰは1アウト目、6-3は遊撃手→一塁手。1つのマスでアウト数と守備経路を読みます。'
 },
 {
  symbol:'Ⅱ / 4-3',
  label:'2アウト目。二塁手が処理して一塁送球で打者アウト',
  ex:'Ⅱは2アウト目、4-3は二塁手→一塁手です。'
 },
 {
  symbol:'Ⅲ / 5-3',
  label:'3アウト目。三塁手が処理して一塁送球で打者アウト',
  ex:'Ⅲは3アウト目、5-3は三塁手→一塁手です。'
 },
 {
  symbol:'S → B',
  label:'盗塁で二塁へ進塁',
  ex:'Sは盗塁、Bは二塁。盗塁による二塁進塁と読みます。'
 },
 {
  symbol:'CS → B',

  ex:'CSは盗塁死。二塁へ進もうとしてアウトになったプレーです。'
 },
 {
  symbol:'W → B',
  label:'暴投で二塁へ進塁',
  ex:'Wは暴投。走者が暴投で次塁へ進んだことを示します。'
 },
 {
  symbol:'P → B',
  label:'捕逸で二塁へ進塁',
  ex:'Pは捕逸。捕手の捕逸で走者が進んだ記録です。'
 },
 {

  ex:'DPは併殺。6-4-3は遊撃手→二塁手→一塁手の典型的なダブルプレーです。'
 },

  label:'左翼方向の安打後に得点',

  ex:'ℓは残塁、Bは二塁。二塁に残ったまま攻撃終了と読みます。'

];

function getScorePool(){
  if(S.difficulty==='beginner')return SCORE_BEGINNER;
  if(S.difficulty==='intermediate')return SCORE_INTERMEDIATE;
  return SCORE_ADVANCED;
}
function scoreVisual(item){
  const s=item.symbol;
  if(s==='●'){
    return `<div class="scoreDiamond"><div class="scoreRunDot"></div></div><div class="scoreSymbolSub">得点</div>`;
  }
  if(s==='○'){
    return `<div class="scoreDiamond"><div class="scoreRunRing"></div></div><div class="scoreSymbolSub">得点</div>`;
  }
  return `<div class="scoreSymbolText">${s}</div>`;
}
function startScoreQuiz(){
  const pool=getScorePool();
  let q=[];
  while(q.length<10)q=q.concat(shuffleArray(pool));
  S.scoreQuestions=q.slice(0,10);
  S.scoreIndex=0;S.scoreCorrect=0;S.scoreLocked=false;
  renderScoreQuestion();
}
function renderScoreQuestion(){
  if(S.scoreIndex>=10){finishScoreQuiz();return}
  const item=S.scoreQuestions[S.scoreIndex];
  $('#scoreLevelName').textContent=buildMeta();
  $('#scoreNo').textContent=S.scoreIndex+1;
  $('#scoreCorrect').textContent=S.scoreCorrect;
  $('#scoreExplain').classList.add('hidden');
  $('#scoreNextBtn').classList.add('hidden');
  $('#trainingCounter').textContent=(S.scoreIndex+1)+'/10';
  $('#progressText').textContent=(S.scoreIndex+1)+'/10';
  $('#progress').style.width=((S.scoreIndex+1)/10*100)+'%';

  const pool=getScorePool();

  if(S.difficulty==='beginner'){
    $('#scoreQuestion').textContent='この記号の意味は？';
    $('#scoreSymbol').classList.remove('hidden');
    $('#scoreSymbol').innerHTML=scoreVisual(item);

    const wrong=shuffleArray(pool.filter(x=>x.label!==item.label)).slice(0,3).map(x=>x.label);
    const choices=shuffleArray([item.label,...wrong]);
    $('#scoreChoices').innerHTML=choices.map(c=>`<button data-score="${c.replace(/"/g,'&quot;')}">${c}</button>`).join('');
    S.scoreAnswer=item.label;

  }else if(S.difficulty==='intermediate'){
    $('#scoreQuestion').textContent=`「${item.label}」を表す記録はどれ？`;
    $('#scoreSymbol').classList.add('hidden');

    const wrong=shuffleArray(pool.filter(x=>x.symbol!==item.symbol)).slice(0,3).map(x=>x.symbol);
    const choices=shuffleArray([item.symbol,...wrong]);
    $('#scoreChoices').innerHTML=choices.map(c=>`<button data-score="${c.replace(/"/g,'&quot;')}">${c}</button>`).join('');
    S.scoreAnswer=item.symbol;

  }else{
    $('#scoreQuestion').textContent='この1マスから読み取れるプレーは？';
    $('#scoreSymbol').classList.remove('hidden');
    $('#scoreSymbol').innerHTML=scoreVisual(item);

    const wrong=shuffleArray(pool.filter(x=>x.label!==item.label)).slice(0,3).map(x=>x.label);
    const choices=shuffleArray([item.label,...wrong]);
    $('#scoreChoices').innerHTML=choices.map(c=>`<button data-score="${c.replace(/"/g,'&quot;')}">${c}</button>`).join('');
    S.scoreAnswer=item.label;
  }

  S.scoreCurrent=item;
  S.scoreLocked=false;
}
function answerScore(val){
  if(!S.running||S.mode!=='score'||S.scoreLocked)return;
  S.scoreLocked=true;
  const ok=String(val)===String(S.scoreAnswer);
  if(ok){S.scoreCorrect++;addPoints(20)}
  $('#scoreCorrect').textContent=S.scoreCorrect;
  $('#scoreExplain').classList.remove('hidden');
  $('#scoreExplain').textContent=(ok?'○ 正解！ +20pt':'× 不正解\n正解：'+S.scoreAnswer)+'\n'+S.scoreCurrent.ex;
  $('#scoreExplain').style.whiteSpace='pre-line';
  $('#scoreNextBtn').classList.remove('hidden');
}
function nextScoreQuestion(){
  if(!S.running||S.mode!=='score')return;
  S.scoreIndex++;
  renderScoreQuestion();
}
function finishScoreQuiz(){
  let bonus=S.scoreCorrect===10?100:S.scoreCorrect>=8?50:0;
  if(bonus)addPoints(bonus);
  let t=`10問中 ${S.scoreCorrect}問正解`;
  if(bonus)t+=`\nボーナス +${bonus}pt`;
  if(S.scoreCorrect===10)t+='\n🏆 SCORE MASTER！';
  finishGeneric('スコア記号クイズ終了！',t);
}

function finishGeneric(title,text){
  stopAll();
  $('#resultTitle').textContent=title;
  $('#resultText').textContent=text;
  showScreen('screenResult');
}

$$('[data-menu]').forEach(b=>b.addEventListener('click',()=>openSettings(b.dataset.menu)));
$('#settingsHomeBtn').addEventListener('click',goTop);
$('#trainingHomeBtn').addEventListener('click',goTop);
$('#resultHomeBtn').addEventListener('click',goTop);
$('#retryBtn').addEventListener('click',()=>openSettings(S.mode));
$('#stopBtn').addEventListener('click',()=>{
  stopAll();
  $('#resultTitle').textContent='トレーニングを中止しました';
  $('#resultText').textContent='記録途中で終了しました。';
  showScreen('screenResult');
});
$('#settingsStartBtn').addEventListener('click',startTraining);

$('#speed').addEventListener('input',e=>{S.speed=Number(e.target.value);$('#speedText').textContent=S.speed});
$('#leftBat').addEventListener('click',()=>{S.batter='left';$('#leftBat').classList.add('active');$('#rightBat').classList.remove('active')});
$('#rightBat').addEventListener('click',()=>{S.batter='right';$('#rightBat').classList.add('active');$('#leftBat').classList.remove('active')});

document.body.addEventListener('click',e=>{
  const d=e.target.closest('[data-diff]');
  if(d){S.difficulty=d.dataset.diff;highlightDifficulty()}
  const a=e.target.closest('[data-answer]');
  if(a)visualAnswer(a.dataset.answer);
  const n=e.target.closest('[data-number]');
  if(n)numberTap(n);
  const q=e.target.closest('[data-quiz]');
  if(q)answerRule(q.dataset.quiz);
  const s=e.target.closest('[data-score]');
  if(s)answerScore(s.dataset.score);
});
$('#quizNextBtn').addEventListener('click',nextRuleQuestion);
$('#scoreNextBtn').addEventListener('click',nextScoreQuestion);

loadPoints();

if('serviceWorker' in navigator){
  window.addEventListener('load',async()=>{
    try{
      const regs=await navigator.serviceWorker.getRegistrations();
      for(const r of regs)await r.unregister();
      const keys=await caches.keys();
      for(const k of keys)await caches.delete(k);
    }catch(e){}
  });
}
})();
</script>
